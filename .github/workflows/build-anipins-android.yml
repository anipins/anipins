name: Build AniPins Android
# Release build for the current mobile app version.
# Build trigger refreshed after Google sign-in fix.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-anipins-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Configure Android upload-key signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANIPINS_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANIPINS_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANIPINS_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANIPINS_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Missing Android signing secrets. Configure ANIPINS_UPLOAD_KEYSTORE_BASE64, ANIPINS_UPLOAD_KEYSTORE_PASSWORD, ANIPINS_UPLOAD_KEY_ALIAS, and ANIPINS_UPLOAD_KEY_PASSWORD in GitHub Actions secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/anipins-upload-key.jks"
          test -s "$RUNNER_TEMP/anipins-upload-key.jks"
          echo "ANIPINS_KEYSTORE_PATH=$RUNNER_TEMP/anipins-upload-key.jks" >> "$GITHUB_ENV"
          echo "ANIPINS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANIPINS_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANIPINS_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build release
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify signed APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose mobile/app/build/outputs/apk/release/app-release.apk
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniPins-Android-${{ github.run_number }}
          path: mobile/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
