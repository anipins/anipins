name: Build AniPins Android

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-anipins-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AniPins-Android-2.3.1
          path: mobile/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
