name: Build AniPins Android
# Release build for the current mobile app version.
# Build trigger refreshed after Google sign-in fix.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-anipins-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Set up Node.js for local APK signing
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned APK signing dependency
        working-directory: .
        run: npm ci --prefix scripts/android-signer --ignore-scripts --no-audit --no-fund
      - name: Sign APK locally with the existing release key
        env:
          ANIPINS_SIGNING_KEY_DATA: ${{ secrets.ANIPINS_SIGNING_KEY_DATA }}
          ANIPINS_SIGNING_PASSWORD: ${{ secrets.ANIPINS_SIGNING_PASSWORD }}
        working-directory: .
        run: |
          set -euo pipefail
          unsigned_apk="mobile/app/build/outputs/apk/release/app-release-unsigned.apk"
          signed_apk="mobile/app/build/outputs/apk/release/AniPins-2.5.22.apk"
          test -s "$unsigned_apk"
          node scripts/sign-android-apk.cjs "$unsigned_apk" "$signed_apk"
          test -s "$signed_apk"

          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --verbose "$signed_apk"
          certificate_digest() {
            "$apksigner" verify --print-certs "$1" \
              | sed -nE 's/.*certificate SHA-256 digest: ([[:xdigit:]]+).*/\1/p' \
              | head -n 1
          }
          expected_digest="632af3681db8f46c66073fd60a51a0baa88b9db8539a3f2cde0c226b86687acc"
          current_digest="$(certificate_digest public/downloads/AniPins-2.5.21.apk)"
          release_digest="$(certificate_digest "$signed_apk")"
          if [[ "$current_digest" != "$expected_digest" || "$release_digest" != "$current_digest" ]]; then
            echo "Release signing certificate does not match the current website download; refusing to publish artifact."
            exit 1
          fi
          rm -f "$unsigned_apk"
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniPins-Android-2.5.22-${{ github.run_number }}
          path: mobile/app/build/outputs/apk/release/AniPins-2.5.22.apk
          if-no-files-found: error
