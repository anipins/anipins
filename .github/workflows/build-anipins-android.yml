name: Build AniPins Android

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-anipins-android.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release
        run: ./gradlew assembleRelease --no-daemon

      - name: Get GitHub OIDC token
        id: oidc
        working-directory: .
        run: |
          TOKEN=$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Accept: application/json; api-version=2.0" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=anipins-apk-signer" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Sign and publish APK
        working-directory: .
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          APK=$(find mobile/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$APK" \
            "https://synqmyiwjyvvrbrhcetw.supabase.co/functions/v1/anipins-apk-signer"

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniPins-Android-2.3.1-build
          path: mobile/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
